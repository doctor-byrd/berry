services:
  supabase-db:
    image: supabase/postgres:15.6.1.138
    container_name: nx_supabase_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_db
      POSTGRES_USER: postgres
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    configs:
      - source: db_init
        target: /docker-entrypoint-initdb.d/init-multiple-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dev_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: nx_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domain.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      supabase-db:
        condition: service_started

  redis:
    image: falkordb/falkordb:6.0.1
    container_name: nx_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_ARGS: "--requirepass dev_redis_password"
    volumes:
      - redis_data:/data

  storage:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: local-object-storage
    user: root
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: storage_admin
      MINIO_ROOT_PASSWORD: storage_secure_password
    volumes:
      - storage_data:/data
    command: server /data --console-address ":9001"

  identity-server:
    image: ghcr.io/goauthentik/server:2024.10.3
    container_name: nx_identity_server
    restart: unless-stopped
    command: server
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9443:9443"
    environment:
      AUTHENTIK_SECRET_KEY: "dev_identity_secret_key_change_me"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: supabase-db
      AUTHENTIK_POSTGRESQL__USER: postgres
      AUTHENTIK_POSTGRESQL__PASSWORD: dev_password
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: dev_redis_password
    volumes:
      - identity_media:/media
      - identity_templates:/templates
    depends_on:
      supabase-db:
        condition: service_started
      redis:
        condition: service_started

  identity-worker:
    image: ghcr.io/goauthentik/server:2024.10.3
    container_name: nx_identity_worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: "dev_identity_secret_key_change_me"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: supabase-db
      AUTHENTIK_POSTGRESQL__USER: postgres
      AUTHENTIK_POSTGRESQL__PASSWORD: dev_password
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: dev_redis_password
    volumes:
      - identity_media:/media
      - identity_templates:/templates
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      identity-server:
        condition: service_started

  commerce-api:
    image: martijnfrompinelab/dokploy-vendure-demo:latest
    container_name: nx_commerce_api
    restart: unless-stopped
    command: npm run start:server
    ports:
      - "127.0.0.1:8000:3000"
    environment:
      NODE_ENV: "production"
      PORT: 3000
      DB_TYPE: "postgres"
      DB_HOST: "supabase-db"
      DB_PORT: 5432
      DB_NAME: "vendure_db"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "dev_password"
      SUPERADMIN_USERNAME: "dev@email.com"
      SUPERADMIN_PASSWORD: "dev_password"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      REDIS_PASSWORD: "dev_redis_password"
      COOKIE_SECRET: "dev_commerce_secret_key_change_me"
      VENDURE_HOST: "localhost"
    volumes:
      - commerce_media:/usr/src/app/vendure_files
    depends_on:
      supabase-db:
        condition: service_healthy
      redis:
        condition: service_started

  commerce-worker:
    image: martijnfrompinelab/dokploy-vendure-demo:latest
    container_name: nx_commerce_worker
    restart: unless-stopped
    command: npm run start:worker
    environment:
      NODE_ENV: "production"
      DB_TYPE: "postgres"
      DB_HOST: "supabase-db"
      DB_PORT: 5432
      DB_NAME: "vendure_db"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "dev_password"
      SUPERADMIN_USERNAME: "dev@email.com"
      SUPERADMIN_PASSWORD: "dev_password"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      REDIS_PASSWORD: "dev_redis_password"
      COOKIE_SECRET: "dev_commerce_secret_key_change_me"
      VENDURE_HOST: "localhost"
    volumes:
      - commerce_media:/usr/src/app/vendure_files
    depends_on:
      commerce-api:
        condition: service_started

  finance-ledger:
    image: ghcr.io/blnkfinance/blnk:v0.15.7
    container_name: nx_finance_ledger
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - "blnk migrate up && blnk start"
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - BLNK_PROJECT_NAME=Blnk
      - BLNK_DATA_SOURCE_DNS=postgres://postgres:dev_password@supabase-db:5432/blnk_db?sslmode=disable
      - BLNK_REDIS_DNS=redis://:dev_redis_password@redis:6379
      - BLNK_SERVER_PORT=5001
      - BLNK_SERVER_SECRET_KEY=dev_ledger_secure_secret_change_me
      - BLNK_SERVER_SECURE=false
    depends_on:
      supabase-db:
        condition: service_healthy
      redis:
        condition: service_started

  finance-orchestrator:
    image: payramapp/payram:sha-0de0686
    container_name: nx_finance_orchestrator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - SERVER=DEVELOPMENT
      - BLOCKCHAIN_NETWORK_TYPE=testnet   # Switch to "mainnet" when you deploy live
      - AES_KEY=dev_secure_payram_aes_key_32_bytes_long!!   # Must be a secure key for credential storage
      - POSTGRES_HOST=supabase-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=payram_db
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_SSLMODE=disable
      - PAYMENTS_APP_SERVER_URL=http://localhost:8080
    depends_on:
      supabase-db:
        condition: service_started

  communication-messaging:
    image: prosodyim/prosody:13.0
    container_name: nx_communication_messaging
    restart: unless-stopped
    ports:
      - "127.0.0.1:5222:5222" # Standard XMPP client port
      - "127.0.0.1:5280:5281" # HTTP WebSockets / BOSH
    environment:
      - PROSODY_STORAGE=sql
      - PROSODY_SQL_DRIVER=PostgreSQL
      - PROSODY_SQL_HOST=supabase-db
      - PROSODY_SQL_DB=prosody_db
      - PROSODY_SQL_USERNAME=postgres
      - PROSODY_SQL_PASSWORD=dev_password
      - PROSODY_VIRTUAL_HOSTS=localhost
      - PROSODY_ADMINS=admin@localhost
      - PROSODY_ENABLE_MODULES=bosh,websocket,http,admin_shell
    volumes:
      - communication_data:/var/lib/prosody
    depends_on:
      supabase-db:
        condition: service_healthy

  communication-media:
    image: livekit/livekit-server:v1.13.11
    container_name: nx_communication_media
    restart: unless-stopped
    command: --config /local/livekit.yaml
    ports:
      - "127.0.0.1:7880:7880" # WebRTC WebSocket / HTTP API
    environment:
      - "LIVEKIT_KEYS=dev_media_key_change_me: dev_media_secret_change_me!!32bytes"
      - LIVEKIT_REDIS_HOST=redis
      - LIVEKIT_REDIS_PORT=6379
      - LIVEKIT_REDIS_PASSWORD=dev_redis_password
    configs:
      - source: livekit_config
        target: /local/livekit.yaml
    depends_on:
      redis:
        condition: service_started

  social-api:
    image: superseriousbusiness/gotosocial:0.22.3
    container_name: nx_social_api
    restart: unless-stopped
    command: ["node", "/gotosocial/gotosocial", "server", "start"]
    ports:
      - "127.0.0.1:8081:8080" # Maps local port 8081 to container port 8080
    environment:
      - GTS_HOST=localhost
      - GTS_PORT=8080
      - GTS_DB_TYPE=postgres
      - GTS_DB_ADDRESS=supabase-db
      - GTS_DB_PORT=5432
      - GTS_DB_USER=postgres
      - GTS_DB_PASSWORD=dev_password
      - GTS_DB_DATABASE=gotosocial_db
      - GTS_DB_TLS_MODE=disable
      - GTS_REDIS_ENABLED=true
      - GTS_REDIS_ADDRESS=redis:6379
      - GTS_REDIS_PASSWORD=dev_redis_password
      - GTS_STORAGE_BACKEND=local
      - GTS_STORAGE_LOCAL_BASE_PATH=/gotosocial/storage
    volumes:
      - social_storage:/gotosocial/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      redis:
        condition: service_started

configs:
  db_init:
    content: |
      CREATE DATABASE authentik_db;
      CREATE DATABASE vendure_db;
      CREATE DATABASE payram_db;
      CREATE DATABASE blnk_db;
      CREATE DATABASE gotosocial_db;
      CREATE DATABASE prosody_db;
      \c saleor_db;
      CREATE ROLE supabase_admin WITH SUPERUSER LOGIN PASSWORD 'dev_password';
      CREATE EXTENSION IF NOT EXISTS hstore;

  livekit_config:
    content: |
      port: 7880
      rtc:
        tcp_port: 7881
        port_range_start: 7882
        port_range_end: 7885
      redis:
        address: redis:6379
        password: dev_redis_password
      logging:
        level: info

volumes:
  supabase_db_data:
  redis_data:
  storage_data:
  communication_data:
  identity_templates:
  identity_media:
  commerce_media:
  social_storage:
