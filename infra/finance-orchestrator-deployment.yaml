apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: finance-orchestrator
  name: finance-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: finance-orchestrator
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: finance-orchestrator
    spec:
      containers:
        - env:
            - name: AES_KEY
              value: dev_secure_payram_aes_key_32_bytes_long!!
            - name: BLOCKCHAIN_NETWORK_TYPE
              value: testnet
            - name: PAYMENTS_APP_SERVER_URL
              value: http://localhost:8080
            - name: POSTGRES_DATABASE
              value: payram_db
            - name: POSTGRES_HOST
              value: supabase-db
            - name: POSTGRES_PASSWORD
              value: dev_password
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_SSLMODE
              value: disable
            - name: POSTGRES_USERNAME
              value: postgres
            - name: SERVER
              value: DEVELOPMENT
          image: payramapp/payram:sha-0de0686
          name: nx-finance-orchestrator
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
