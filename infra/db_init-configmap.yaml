apiVersion: v1
data:
  init-multiple-dbs.sql: |
    CREATE DATABASE authentik_db;
    CREATE DATABASE vendure_db;
    CREATE DATABASE firefly_db;
    CREATE DATABASE blnk_db;
    CREATE DATABASE gotosocial_db;
    CREATE DATABASE ejabberd_db;
    CREATE ROLE supabase_admin WITH SUPERUSER LOGIN PASSWORD 'dev_password';
    CREATE EXTENSION IF NOT EXISTS hstore;
kind: ConfigMap
metadata:
  labels:
    io.kompose.service: supabase-db
  name: db-init
