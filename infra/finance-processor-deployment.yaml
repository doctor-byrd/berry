apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: finance-processor
  name: finance-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: finance-processor
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: finance-processor
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z supabase-db 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: finance-processor
          image: ghcr.io/hyperledger-firefly/firefly:v1.5.0-20260916-863
          command:
            - /bin/sh
            - -c
          args:
            - migrate -path /firefly/db/migrations/postgres -database "$DATABASE_URL" up && firefly -f /config/firefly.yaml
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:dev_password@supabase-db:5432/firefly_db?sslmode=disable"
          ports:
            - containerPort: 8000
              protocol: TCP
            - containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /config
      volumes:
        - name: config-volume
          configMap:
            name: firefly-core-config
      restartPolicy: Always