apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: social-api
  name: social-api
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: social-api
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: social-api
    spec:
      containers:
        - args:
            - node
            - /gotosocial/gotosocial
            - server
            - start
          env:
            - name: GTS_DB_ADDRESS
              value: supabase-db
            - name: GTS_DB_DATABASE
              value: gotosocial_db
            - name: GTS_DB_PASSWORD
              value: dev_password
            - name: GTS_DB_PORT
              value: "5432"
            - name: GTS_DB_TLS_MODE
              value: disable
            - name: GTS_DB_TYPE
              value: postgres
            - name: GTS_DB_USER
              value: postgres
            - name: GTS_HOST
              value: localhost
            - name: GTS_PORT
              value: "8080"
            - name: GTS_REDIS_ADDRESS
              value: redis:6379
            - name: GTS_REDIS_ENABLED
              value: "true"
            - name: GTS_REDIS_PASSWORD
              value: dev_redis_password
            - name: GTS_STORAGE_BACKEND
              value: local
            - name: GTS_STORAGE_LOCAL_BASE_PATH
              value: /gotosocial/storage
          image: superseriousbusiness/gotosocial:0.22.3
          name: nx-social-api
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: /gotosocial/storage
              name: social-storage
      restartPolicy: Always
      volumes:
        - name: social-storage
          persistentVolumeClaim:
            claimName: social-storage
